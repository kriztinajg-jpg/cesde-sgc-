spring:
  application:
    name: sgc-api
  datasource:
    url: jdbc:mysql://localhost:3306/cesde_sgc
    username: root
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

server:
  error:
    include-message: always
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax

# Carpeta donde se guardan los archivos subidos (no se sube a Git)
app:
  storage:
    dir: ${STORAGE_DIR:uploads}
  admin:
    email: ${ADMIN_EMAIL:admin@cesde.edu.co}
    password: ${ADMIN_PASSWORD:}